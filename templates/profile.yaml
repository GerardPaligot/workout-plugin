# Profile template — copy to profile.yaml at the workspace root (written by the onboarding skill)
# language: code of the language used for all user-facing text (e.g.: fr, en, pt-BR)
# units.load: kg | lb — units.length: cm | in
# equipment[].id must exist in the equipment list of the plugin catalog or of exercises.custom.yaml
# equipment[].category: machine | cable | free_weight | accessory | cardio
meta:
  schema_version: 1
language: en
units:
  load: kg
  length: cm
equipment:
  - { id: chest_press, name: "Chest Press", category: machine, muscles: [chest, triceps, shoulders], notes: null }
  - { id: bench, name: "Bench", category: accessory, notes: null }
